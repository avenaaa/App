<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CliniScope — Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1C9A5B;
    --green-dark: #14874F;
    --green-light: #E7F6EE;
    --text-dark: #1F2A24;
    --text-muted: #5C6B63;
    --white: #FFFFFF;
    --border: #E1E8E3;
    --red: #C94545;
    --red-light: #FBE7E7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: 'Poppins', sans-serif;
    background: var(--green-light);
    color: var(--text-dark);
  }

  a { text-decoration: none; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-card {
    background: var(--white);
    border: 2px solid var(--border);
    border-radius: 24px;
    padding: 44px 40px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(28, 154, 91, 0.12);
  }

  .login-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 30px;
  }

  .login-logo img { width: 56px; height: 56px; object-fit: contain; }
  .login-logo span {
    color: var(--green-dark);
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }

  .login-title {
    text-align: center;
    margin-bottom: 30px;
  }
  .login-title h1 {
    font-size: 22px;
    font-weight: 800;
    color: var(--text-dark);
    margin-bottom: 6px;
  }
  .login-title p {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .form-group { margin-bottom: 18px; }

  .form-group label {
    display: block;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 8px;
  }

  .form-group input {
    width: 100%;
    padding: 13px 16px;
    border-radius: 12px;
    border: 2px solid var(--border);
    font-family: 'Poppins', sans-serif;
    font-size: 14.5px;
    font-weight: 500;
    color: var(--text-dark);
    outline: none;
  }
  .form-group input:focus { border-color: var(--green); }

  .password-wrapper { position: relative; }
  .password-wrapper input { padding-right: 46px; }

  .toggle-password {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    padding: 4px;
  }
  .toggle-password:hover { color: var(--green-dark); }

  .login-btn {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: var(--green);
    color: var(--white);
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15.5px;
    cursor: pointer;
    margin-top: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .login-btn:hover { background: var(--green-dark); }
  .login-btn:disabled { opacity: 0.7; cursor: not-allowed; }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2.5px solid rgba(255,255,255,0.4);
    border-top-color: var(--white);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .login-btn.loading .spinner { display: inline-block; }
  .login-btn.loading .btn-text { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box {
    display: none;
    align-items: flex-start;
    gap: 10px;
    background: var(--red-light);
    color: var(--red);
    font-size: 13.5px;
    font-weight: 600;
    padding: 12px 14px;
    border-radius: 12px;
    margin-bottom: 18px;
    line-height: 1.5;
  }
  .error-box.show { display: flex; }
  .error-box svg { flex-shrink: 0; margin-top: 1px; }

  .back-link {
    display: block;
    text-align: center;
    margin-top: 24px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .back-link:hover { color: var(--green-dark); }

  @media (max-width: 480px) {
    .login-card { padding: 34px 26px; }
  }
</style>
<link rel="icon" type="image/png" href="cliniscopelogo.png">
</head>
<body>

  <div class="login-card">
    <div class="login-logo">
      <img src="cliniscopegreenlogo.png" alt="CliniScope logo">
      <span>CliniScope</span>
    </div>

    <div class="login-title">
      <h1>Admin Login</h1>
      <p>Sign in to manage health facility listings.</p>
    </div>

    <div class="error-box" id="errorBox">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="errorText">Something went wrong.</span>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        <span class="spinner"></span>
        <span class="btn-text">Log In</span>
      </button>
    </form>

    <a href="index.html" class="back-link">&larr; Back to CliniScope</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="data.js"></script>

  <script>
    // If already logged in, skip straight to the dashboard.
    (async () => {
      const session = await getAdminSession();
      if (session) window.location.href = 'dashboard.html';
    })();

    const form = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const errorBox = document.getElementById('errorBox');
    const errorText = document.getElementById('errorText');

    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    togglePassword.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      togglePassword.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });

    function showError(message) {
      errorText.textContent = message;
      errorBox.classList.add('show');
    }
    function hideError() {
      errorBox.classList.remove('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;

      loginBtn.classList.add('loading');
      loginBtn.disabled = true;

      const result = await loginAdmin(email, password);

      loginBtn.classList.remove('loading');
      loginBtn.disabled = false;

      if (!result.success) {
        // Supabase's raw error messages are technical; show a friendlier one
        // for the most common case (wrong email/password).
        const friendly = result.message.toLowerCase().includes('invalid login')
          ? 'Incorrect email or password. Please try again.'
          : result.message;
        showError(friendly);
        return;
      }

      window.location.href = 'dashboard.html';
    });
  </script>

</body>
</html>
